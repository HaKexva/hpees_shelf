# PostgreSQL configuration
#
# Install PostgreSQL:
#   macOS:  brew install postgresql@17
#   Ubuntu: sudo apt-get install postgresql
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: hpees_shelf_development
  demo:
    <<: *default
    database: hpees_shelf_development_demo

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: hpees_shelf_test
  demo:
    <<: *default
    database: hpees_shelf_test_demo

# Production uses DATABASE_URL (auto-injected by Railway).
# All Solid gem tables (cache, queue, cable) share the same database
# since their table names are uniquely prefixed.
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
  demo:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/demo_migrate
